name: Attach toolchain archives to release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  archive:
    name: Package openocd_wch_linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Create tar.gz archive
        shell: bash
        env:
          ARCHIVE_NAME: openocd_wch_linux
        run: |
          find README.md version.txt bin share -type d -exec chmod 755 {} +
          find README.md version.txt bin share -type f -exec chmod 644 {} +
          chmod 755 bin/openocd
          tar -czf "${RUNNER_TEMP}/${ARCHIVE_NAME}.tar.gz" \
            --transform="s,^,${ARCHIVE_NAME}/," \
            -- README.md version.txt bin share

      - name: Attach archive to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ARCHIVE_NAME: openocd_wch_linux
        run: |
          gh release upload "$RELEASE_TAG" "${RUNNER_TEMP}/${ARCHIVE_NAME}.tar.gz" --clobber

      - name: Write archive summary
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ARCHIVE_NAME: openocd_wch_linux
        run: |
          archive_file="${ARCHIVE_NAME}.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive_file}"
          checksum=$(sha256sum "$archive_path" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')
          size=$(stat -c '%s' "$archive_path")
          encoded_tag=$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${encoded_tag}/${archive_file}"

          {
            printf '### %s\n\n```json\n' "$archive_file"
            jq -n \
              --arg host "x86_64-linux-gnu" \
              --arg url "$url" \
              --arg archiveFileName "$archive_file" \
              --arg checksum "SHA-256:${checksum}" \
              --arg size "$size" \
              '{host: $host, url: $url, archiveFileName: $archiveFileName, checksum: $checksum, size: $size}'
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
